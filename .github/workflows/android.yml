name: 构建安卓 APK

# 本机没有 JDK、Gradle / Maven 依赖也拉不动，所以把编译放到 GitHub 的机器上跑。
# 推 mobile/ 下的任意改动就会自动出一版 APK；也可以到 Actions 页面手动点「Run workflow」。

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 注意：不要用默认的 packages（它还在装早已下架的 "tools" 包，会直接失败）
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: 安装 npm 依赖
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: 同步 Web 资源到安卓工程
        working-directory: mobile
        run: npx cap sync android

      - name: 编译 APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: bigdata-beisai-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 结果汇总
        run: |
          echo "### ✅ APK 构建完成" >> $GITHUB_STEP_SUMMARY
          ls -lh mobile/android/app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY
